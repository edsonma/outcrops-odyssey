<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Outcrops Odyssey — Bevy 3D prototype</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f0a; overflow: hidden; touch-action: none;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    canvas#bevy { display: block; width: 100%; height: 100%; outline: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
      color: #d8cfae; font: 18px/1.5 system-ui, sans-serif; pointer-events: none; }
    #status.error { color: #ff9c8a; pointer-events: auto; }
  </style>
</head>
<body>
  <canvas id="bevy"></canvas>
  <div id="status">Loading Outcrops Odyssey… (first load downloads the game, this can take a moment)</div>
  <script type="module">
    import init from "./outcrops_bevy.js";
    const status = document.getElementById("status");
    try {
      await init();             // starts the Bevy app; this promise only settles if it exits/errors
    } catch (e) {
      // Bevy "returns" via an exception on the web once its event loop is running; that one is normal.
      if (!String(e).includes("Using exceptions for control flow")) {
        status.className = "error";
        status.textContent = "Could not start: " + e + "  (needs a browser with WebGL2" + ")";
        console.error(e);
        throw e;
      }
    }
    // hide the status text once the first frame is drawn
    requestAnimationFrame(() => status.remove());
  </script>
</body>
</html>
