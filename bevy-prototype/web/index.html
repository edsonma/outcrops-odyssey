<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0f0a">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Outcrops Odyssey</title>
  <style>
    html, body { margin: 0; height: 100%; height: 100dvh; background: #0b0f0a; overflow: hidden; touch-action: none;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    canvas#bevy { display: block; width: 100%; height: 100%; outline: none; }

    /* ---- opening / loading page ---- */
    #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 22px; padding: 24px; text-align: center; color: #efe6c8;
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(ellipse at 50% 30%, #35502f 0%, #1a2a1a 55%, #0b0f0a 100%);
      transition: opacity .7s ease, visibility .7s; }
    #splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash h1 { margin: 0; font-size: clamp(32px, 7vw, 64px); letter-spacing: .04em; font-weight: 700;
      text-shadow: 0 3px 0 #0006, 0 0 40px #e8a24a55; }
    #splash h1 span { color: #f0a04a; }
    #splash .sub { margin: -10px 0 0; font-size: clamp(14px, 2.6vw, 20px); color: #b9c8a0; font-style: italic; }
    /* the outcrop picture: dark and grey at first, revealed in colour left-to-right as the game downloads */
    #strata { position: relative; width: min(560px, 88vw, calc(36vh * 2.136)); aspect-ratio: 1833 / 858; border-radius: 14px; overflow: hidden;
      box-shadow: 0 10px 34px #000a; background: #1c1c18; }
    #strata img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
    #strata img.base { filter: grayscale(1) brightness(.35) contrast(1.1); }
    #strata img.lit { clip-path: inset(0 100% 0 0); transition: clip-path .25s ease-out; }
    #strata .hammer { position: absolute; right: 14px; top: 10px; font-size: 30px; transform-origin: 80% 90%;
      animation: tap 0.9s ease-in-out infinite; filter: drop-shadow(0 2px 3px #0008); }
    @keyframes tap { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(22deg); } }
    #bar { width: min(560px, 88vw); height: 8px; border-radius: 4px; background: #ffffff1c; overflow: hidden; }
    #bar > div { height: 100%; width: 0%; background: linear-gradient(90deg, #f0a04a, #ffd27a); transition: width .25s ease-out; }
    #msg { white-space: pre-line; font: 15px/1.4 system-ui, sans-serif; color: #cfd8bd; min-height: 1.4em; }
    #tip { max-width: 440px; font: 14px/1.5 system-ui, sans-serif; color: #98a688; }
    #splash.error h1 span, #splash.error #msg { color: #ff9c8a; }
    #splash.error .hammer { animation: none; }
    #start { display: none; font: 700 20px system-ui, sans-serif; padding: 14px 40px; border: 0; border-radius: 12px;
      background: linear-gradient(#ffc36a, #f0a04a); color: #20150a; cursor: pointer; box-shadow: 0 6px 22px #f0a04a55;
      animation: pulse 1.6s ease-in-out infinite; }
    #splash.ready #start { display: inline-block; }
    #splash.ready #bar { opacity: .55; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    #splash.go { opacity: 0; visibility: hidden; transition: opacity 1.1s ease, visibility 1.1s; pointer-events: none; }
    #err { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 20; display: none; max-height: 40vh; overflow: auto;
      padding: 10px 12px; border-radius: 8px; background: #3a1410ee; color: #ffd0c6; font: 12px/1.4 ui-monospace, monospace;
      white-space: pre-wrap; word-break: break-word; user-select: text; -webkit-user-select: text; }
    /* short screens (a phone held sideways, with the browser bar): compact so the button stays visible */
    @media (max-height: 560px) {
      #splash { gap: 8px; padding: 6px 16px; }
      #splash h1 { font-size: clamp(26px, 8vh, 44px); }
      #splash .sub, #tip { display: none; }
      #bar { width: min(560px, 88vw, calc(36vh * 2.136)); }
      #start { padding: 8px 28px; font-size: 17px; }
    }
    #retry { display: none; font: 600 15px system-ui, sans-serif; padding: 10px 22px; border: 0; border-radius: 8px;
      background: #f0a04a; color: #20150a; cursor: pointer; }
    #splash.error #retry { display: inline-block; }
  </style>
</head>
<body>
  <canvas id="bevy"></canvas>

  <div id="err"></div>

  <div id="splash">
    <h1>Outcrops <span>Odyssey</span></h1>
    <p class="sub">Read the rocks. Walk the land. Collect the cards.</p>
    <div id="strata"><img class="base" src="outcrop.jpg" alt=""><img class="lit" id="lit" src="outcrop.jpg" alt="Tilted rock layers in an outcrop"><div class="hammer">⛏️</div></div>
    <div id="bar"><div id="barfill"></div></div>
    <div id="msg">Preparing the expedition…</div>
    <div id="tip"></div>
    <button id="start">▶ Start expedition</button>
    <button id="retry" onclick="location.reload()">Try again</button>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const splash = $("splash");
    const TIPS = [
      "Tip: contour lines get closer together where the slope is steep.",
      "Tip: head back to a main road before sunset, night in the field ends the run.",
      "Tip: fill your bottle at lakes and rivers; rest and snack in the shade of a tree.",
      "Tip: layers (strata) tilt with the dip; the youngest rocks are usually on top.",
      "Tip: press B for your backpack, V to change the camera.",
    ];
    $("tip").textContent = TIPS[Math.floor(Math.random() * TIPS.length)];

    function progress(frac, msg) {
      const p = Math.max(0, Math.min(1, frac));
      $("barfill").style.width = (p * 100).toFixed(1) + "%";
      $("lit").style.clipPath = `inset(0 ${((1 - p) * 100).toFixed(1)}% 0 0)`;
      if (msg) $("msg").textContent = msg;
    }
    // phones have no console: show what went wrong right on the page (select + copy to report it)
    const seen = new Set();
    function showError(msg) {
      if (String(msg).includes("Using exceptions for control flow")) return;
      const m = String(msg).slice(0, 400);
      if (seen.has(m) || seen.size >= 3) return;
      seen.add(m);
      const box = $("err");
      box.style.display = "block";
      box.textContent += (box.textContent ? "\n\n" : "") + m + "\n" + navigator.userAgent;
    }
    addEventListener("error", (ev) => showError(ev.message || ev.error));
    addEventListener("unhandledrejection", (ev) => showError(ev.reason));

    function fail(e) {
      splash.classList.add("error");
      progress(0, "Could not start: " + e + "\nIf this keeps happening, clear this site's data in Chrome settings and reload.");
      console.error(e);
    }

    // Download the wasm ourselves so we can show a true percentage. The server reports the
    // uncompressed size in X-Uncompressed-Length (the body itself is brotli/gzip compressed).
    async function fetchWasm(url) {
      const res = await fetch(url, { cache: "reload" });
      if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
      const total = Number(res.headers.get("X-Uncompressed-Length")) || Number(res.headers.get("Content-Length")) || 0;
      const compressed = !!res.headers.get("Content-Encoding");
      if (!res.body || !total) return res;
      let got = 0;
      const reader = res.body.getReader();
      const body = new ReadableStream({
        async pull(ctl) {
          const { done, value } = await reader.read();
          if (done) { ctl.close(); progress(0.92, "Starting the engine…"); return; }
          got += value.length;
          // when the body is compressed, `got` is compressed bytes: scale against the compressed length if known
          const denom = compressed ? Number(res.headers.get("Content-Length")) || 0 : total;
          if (denom) progress((got / denom) * 0.92, `Unpacking the field kit… ${Math.min(99, Math.round((got / denom) * 100))}%`);
          ctl.enqueue(value);
        },
        cancel() { reader.cancel(); },
      });
      return new Response(body, { headers: { "Content-Type": "application/wasm" } });
    }

    async function main() {
      if (!document.createElement("canvas").getContext("webgl2")) {
        throw new Error("WebGL2 is not available in this browser. Turn on hardware acceleration in Chrome settings, or try another browser.");
      }
      progress(0.02, "Downloading the game…");
      // Load the JS glue through a blob so a copy cached by an older deploy can never be used: glue and
      // wasm must come from the same build ("function import requires a callable" otherwise).
      const glue = await fetch("./outcrops_bevy.js", { cache: "reload" });
      if (!glue.ok) throw new Error("outcrops_bevy.js: HTTP " + glue.status);
      const blobUrl = URL.createObjectURL(new Blob([await glue.text()], { type: "text/javascript" }));
      const { default: init } = await import(blobUrl);
      const wasm = fetchWasm("./outcrops_bevy_bg.wasm");
      // hide the splash once the first frames are on screen (the engine keeps streaming textures in)
      let started = false;
      // loaded: wait for a tap (browsers only allow fullscreen from a user gesture), then go
      // fullscreen and pull the camera back from a close-up
      const reveal = () => {
        if (started) return;
        started = true;
        progress(1, "Ready!");
        splash.classList.add("ready");
        // Start = fullscreen + landscape, requested right inside the tap (browsers only allow it from a
        // user gesture). Both are best-effort: if refused, the game just starts as it is.
        const go = async () => {
          if (go.done) return;
          go.done = true;
          $("start").onclick = null;
          $("start").style.display = "none";
          $("msg").textContent = "Switching to landscape fullscreen…";   // the one-second reminder
          // some Android browsers never settle these promises, so nothing here may be awaited unguarded
          const guard = (fn, ms) => new Promise((resolve) => {
            const t = setTimeout(resolve, ms);
            try { Promise.resolve(fn()).catch(() => {}).finally(() => { clearTimeout(t); resolve(); }); } catch { clearTimeout(t); resolve(); }
          });
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const fsOk = guard(() => document.documentElement.requestFullscreen({ navigationUI: "hide" }), 1200);
          const lockOk = fsOk.then(() => guard(() => screen.orientation.lock("landscape"), 1200));
          await Promise.all([sleep(1000), lockOk]);        // at most ~2.4 s, whatever the browser does
          window.ooStarted = true;                            // starts the camera zoom-out (poll_intro in main.rs)
          splash.classList.add("go");
          setTimeout(() => splash.remove(), 1300);
        };
        $("start").onclick = go;
        addEventListener("keydown", (e) => { if (e.key === "Enter") go(); }, { once: true });
      };
      const watchdog = setTimeout(reveal, 90000);
      try {
        const p = init({ module_or_path: wasm });
        // Bevy starts its loop inside init(); it only settles via the control-flow exception below
        await p;
      } catch (e) {
        // Bevy "returns" via an exception on the web once its event loop is running; that one is normal.
        if (!String(e).includes("Using exceptions for control flow")) { clearTimeout(watchdog); return fail(e); }
      }
      clearTimeout(watchdog);
      progress(0.96, "Loading terrain and textures…");
      requestAnimationFrame(() => requestAnimationFrame(reveal));
    }
    main().catch(fail);
  </script>
</body>
</html>
