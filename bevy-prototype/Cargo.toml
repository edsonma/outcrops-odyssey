[package]
name = "outcrops_bevy"
version = "0.1.0"
edition = "2021"
description = "Bevy 0.19 3D prototype of Outcrops Odyssey (reuses the game logic from ../src)"

# Keep this crate out of any parent workspace: the Macroquad game in ../ is built separately.
[workspace]

[features]
# Pick ONE web graphics backend (they are separate builds, not a runtime fallback):
#   WebGL2 (widest support, default):  cargo build --release --target wasm32-unknown-unknown
#   WebGPU (newer browsers only):      cargo build --release --target wasm32-unknown-unknown --no-default-features --features webgpu
default = ["webgl2"]
webgl2 = ["bevy/webgl2"]
webgpu = ["bevy/webgpu"]

[dependencies]
# Hand-picked features: no audio / gamepad (they need system libs: alsa, udev) and no wayland.
bevy = { version = "0.19", default-features = false, features = [
    "default_app", "std", "default_font", "bevy_winit",
    "common_api", "3d_bevy_render", "ui_bevy_render", "scene", "png", "jpeg",
] }

# Threads and X11 exist on desktop only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["multi_threaded", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["web"] }
# phone detection (user agent) and the device pixel ratio
web-sys = { version = "0.3", features = ["Window", "Navigator"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
